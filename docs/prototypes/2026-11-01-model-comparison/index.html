 tip.innerHTML=`<div class="tip-title"><i class="dot" style="color:${color(m)}"></i>${esc(m.name)} <span class="tag">${m.deploy}</span></div><div class="tip-sub">${m.provider} · ${m.params}</div><dl class="tip-data"><div><dt>${state.track==='general'?'综合分':'写作分'}</dt><dd>${fixed(score(m))}</dd></div><div><dt>${state.metric==='latency'?'响应中位':'正文首字'}</dt><dd>${fixed(m[state.metric])} <small>秒</small></dd></div></dl>${group.length>1?'<div class="tip-sub">'+group.length+' 个配置位于同一坐标</div><div class="tip-cluster">'+group.map(row=>`<button data-action="tip-model" data-id="${row.id}">${esc(title(row))}</button>`).join('')+'</div>':''}<div class="tip-sub">${m.concurrency==null?'并发条件未记录':'并发 '+m.concurrency+' · 超时 '+m.timeout+' 秒'} · 11月1日</div><div class="tip-actions"><button class="btn small" data-action="toggle" data-id="${m.id}">${icon(state.selected.includes(m.id)?'check':'plus',13)}${state.selected.includes(m.id)?'已加入':'加入对比'}</button><button class="btn small" data-action="report" data-id="${m.id}">演示报告 ${icon('arrow',13)}</button></div>`;
 tip.hidden=false;const area=$('scatter-area'),point=$('scatter').querySelector(`[data-id="${id}"]`)?.getBoundingClientRect(),bounds=area.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;let left=point?point.left-bounds.left+18:30,top=point?point.top-bounds.top+12:30;
 if(left+tw>bounds.width-7)left=(point?point.left-bounds.left:bounds.width)-tw-12;left=Math.max(6,Math.min(left,bounds.width-tw-6));top=Math.max(9,Math.min(top,bounds.height-th-7));tip.style.left=left+'px';tip.style.top=top+'px';setHighlight(id);
}
function renderReport(id){const m=getAll().find(m=>m.id===id);if(!m)return;state.report=id;lastFocus=document.activeElement;const value=score(m),values=dims(m),names=labels[state.track],history=[value-2.4,value-1.5,value-.6,value],dates=['10/27','10/29','10/31','11/01'];
 const W=390,H=145,L=27,R=15,T=16,B=29,x=i=>L+i*(W-L-R)/3,y=v=>T+(100-v)/100*(H-T-B),line=history.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');
 let trend='';for(const n of [0,50,100])trend+=`<line class="chart-grid" x1="${L}" y1="${y(n)}" x2="${W-R}" y2="${y(n)}"/><text class="trend-label" text-anchor="end" x="${L-7}" y="${y(n)+3}">${n}</text>`;trend+=`<path d="${line}" stroke="${color(m)}" stroke-width="2" fill="none"/>`;history.forEach((v,i)=>{trend+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="${color(m)}"/><text class="trend-label" x="${x(i)}" y="${H-7}" text-anchor="middle">${dates[i]}</text><text class="trend-label" x="${x(i)}" y="${y(v)+(v>85?17:-10)}" text-anchor="middle">${fixed(v)}</text>`;});
 $('report-body').innerHTML=`<div style="--model-color:${color(m)}"><div class="report-name">${m.name}</div><div class="report-subtitle"><i class="dot" style="color:${color(m)}"></i>${m.provider}<span class="tag">${m.deploy}</span></div><p class="report-caption">${m.params} · 合成记录</p><div class="report-score"><b>${fixed(value)}</b><span>${state.track==='general'?'通用综合分':'独立写作分'} / 100</span></div><div class="report-dim">${values.map((v,i)=>`<div><span class="muted">${names[i]}</span><strong class="numeric">${fixed(v)}${state.track==='writing'?' / 4':''}</strong><div class="bar"><i style="width:${v/(state.track==='general'?100:4)*100}%"></i></div></div>`).join('')}</div><section class="report-section"><h3>本轮观测</h3><div class="mini-metrics"><div class="mini-metric"><small>单次响应中位</small><strong>${fixed(m.latency)} <span>秒</span></strong></div><div class="mini-metric"><small>正文首字等待</small><strong>${fixed(m.ttft)} <span>秒</span></strong></div></div></section><section class="report-section"><h3>同配置历史</h3><svg class="trend" viewBox="0 0 390 145" role="img" aria-label="四次合成历史记录：${history.map(fixed).join('、')}分">${trend}</svg><p class="report-caption">同配置、同协议的 4 次合成记录。主页仍显示最近完整成绩。</p></section><section class="report-section"><h3>比较条件</h3><dl class="condition-list"><dt>协议</dt><dd>${state.track==='general'?'通用基线 · 905题':'写作基线 · 12题'}</dd><dt>并发 / 超时</dt><dd>${m.concurrency??'未记录'} / ${m.timeout}秒</dd><dt>已知 Token</dt><dd>${num(m.tokens)}${m.coverage<1?' · 部分用量':''}</dd>${state.track==='writing'?`<dt>裁判</dt><dd>${m.judge}</dd>`:''}<dt>数据来源</dt><dd>交互样稿合成数据</dd></dl></section></div>`;
 $('report-overlay').hidden=false;$('report-overlay').querySelector('.report-panel').scrollTop=0;document.body.style.overflow='hidden';$('report-overlay').querySelector('[data-action="close-report"]').focus();closeTooltip();closeMenus();
}
function closeReport(){state.report=null;$('report-overlay').hidden=true;document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus();}
function renderEmpty(){const total=getAll().length,rows=getRows(),empty=!rows.length;$('content').hidden=empty;$('empty').hidden=!empty;if(empty)$('empty').innerHTML=`<div><div class="empty-mark" style="margin:0 auto 20px">${icon(total?'search':'bars')}</div><h2>${total?'没有匹配的模型配置':'尚无完整成绩'}</h2><p style="margin:9px auto 0">${total?'调整关键词，查看这个协议下的其他配置。':'完成评测后，这里将展示能力、响应及各配置的差异。'}</p><button class="btn" style="margin-top:20px" data-action="${total?'clear-search':'demo-multi'}">${total?'清空搜索':'切换到多模型演示'} ${icon('arrow',15)}</button></div>`;return empty;}
function render(){closeTooltip();closeMenus();renderScenes();$('protocol-name').textContent=state.track==='general'?'通用基线':'写作基线';$('protocol-count').textContent=state.track==='general'?'905 题':'12 题';$('scope-subtitle').textContent=`${getAll().length} 个完成配置 · 同配置、同协议的最近完整成绩`;$('clear-search').hidden=!state.query;
 document.querySelectorAll('[data-action="track"]').forEach(b=>{const active=b.dataset.value===state.track;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});
 document.querySelectorAll('[data-action="metric"]').forEach(b=>{const active=b.dataset.value===state.metric;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
 document.querySelectorAll('[data-action="profile"]').forEach(b=>{const active=b.dataset.value===state.profile;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
 if(!renderEmpty()){renderFocus();renderAddMenu();renderScatter();renderProfile();renderMatrix();}hydrateIcons();
}
document.addEventListener('click',event=>{const el=event.target.closest?.('[data-action]');if(!el){if(!event.target.closest('.dropdown')&&!event.target.closest('.tooltip')){closeMenus();if(!event.target.closest('.point-hit')){closeTooltip();setHighlight(null);}}return;}const action=el.dataset.action,id=el.dataset.id,value=el.dataset.value;
 switch(action){
 case 'theme':{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('theme-button').setAttribute('aria-label',dark?'切换为深色主题':'切换为浅色主题');$('theme-button').setAttribute('title',dark?'切换为深色主题':'切换为浅色主题');$('theme-button').innerHTML=icon(dark?'moon':'sun');break;}
 case 'motion':{const on=document.documentElement.dataset.reduced!=='true';document.documentElement.dataset.reduced=String(on);el.setAttribute('aria-pressed',String(on));el.style.color=on?'var(--accent)':'';toast(on?'已减少动态效果':'已恢复短过渡；仍尊重系统动态效果偏好');break;}
 case 'width':$('layout').classList.toggle('narrow',value==='narrow');document.querySelectorAll('[data-action="width"]').forEach(b=>{b.classList.toggle('active',b===el);b.setAttribute('aria-pressed',String(b===el));});break;
 case 'scene-menu':toggleMenu('scene-menu','scene-button');break;
 case 'scene':state.scene=value;state.query='';$('search').value='';state.sort='score';state.descending=true;defaults();render();$('scene-button').focus();break;
 case 'demo-multi':state.scene='multi';defaults();render();break;
 case 'add-menu':renderAddMenu();toggleMenu('add-menu','add-button');break;
 case 'toggle':toggleModel(id);break;
 case 'toggle-check':toggleModel(id);break;
 case 'baseline':state.baseline=id;if(state.profile==='radar'){state.profile='delta';render();}else{renderFocus();renderProfile();}break;
 case 'track':if(value!==state.track){state.track=value;state.sort='score';state.descending=true;profileCache.clear();defaults();render();}break;
 case 'profile':state.profile=value;render();break;
 case 'metric':state.metric=value;render();break;
 case 'point':showTooltip(id,true,el.dataset.group.split(','));break;
 case 'tip-model':showTooltip(id,true);break;
 case 'report':renderReport(id);break;
 case 'close-report':closeReport();break;
 case 'clear-search':state.query='';$('search').value='';render();$('search').focus();break;
 case 'sort':if(state.sort===value)state.descending=!state.descending;else{state.sort=value;state.descending=value!=='latency'&&value!=='name';}renderMatrix();break;
 case 'reset-selection':defaults();render();toast('已关注当前最高分及响应最快的配置');break;
 case 'scatter-help':case 'method':toast('同协议比较观测成绩；未知条件不补零，不跨条件连接统一边界。分数与用量不改写。');break;
 case 'new-run':toast('这是独立交互样稿，不会启动评测或调用真实模型。');break;
 case 'unavailable':toast('此样稿聚焦模型比较；任务与存储功能不接入。');break;
 }
});
$('search').addEventListener('input',event=>{state.query=event.target.value;render();});
document.addEventListener('pointerover',event=>{const point=event.target.closest?.('.point-hit');if(point&&!state.tip?.pinned)showTooltip(point.dataset.id,false,point.dataset.group.split(','));const row=event.target.closest?.('tr[data-model],.radar-set,.card-legend [data-model]');if(row&&!state.tip?.pinned)setHighlight(row.dataset.model);});
document.addEventListener('pointerout',event=>{const row=event.target.closest?.('tr[data-model],.radar-set,.card-legend [data-model]');if(row&&!row.contains(event.relatedTarget)&&!state.tip?.pinned)setHighlight(null);});
$('scatter-area').addEventListener('pointerleave',()=>{if(!state.tip?.pinned){closeTooltip();setHighlight(null);}});
document.addEventListener('focusin',event=>{const p=event.target.closest?.('.point-hit');if(p)showTooltip(p.dataset.id,true,p.dataset.group.split(','));});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('report-overlay').hidden){closeReport();}else{closeMenus();closeTooltip();setHighlight(null);}event.preventDefault();return;}if(event.target.matches?.('.point-hit')&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;const menu=event.target.closest?.('[role="menu"]');if(menu){const buttons=[...menu.querySelectorAll('button')],i=buttons.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(i+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next]?.focus();event.preventDefault();}});
$('report-overlay').addEventListener('click',event=>{if(event.target===$('report-overlay'))closeReport();});
$('report-overlay').addEventListener('keydown',event=>{if(event.key!=='Tab')return;const elements=[...$('report-overlay').querySelectorAll('button,[tabindex="0"]')],first=elements[0],last=elements.at(-1);if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}});
new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!$('content').hidden)renderScatter();},70);}).observe($('scatter-area'));
new ResizeObserver(updateTableHint).observe($('table-scroll'));
window.addEventListener('pagehide',()=>{clearTimeout(toastTimer);clearTimeout(resizeTimer);});
window.comparisonPrototype={getState:()=>({...state,rows:getRows().map(m=>({id:m.id,score:score(m),latency:m.latency}))}),setScene:scene=>{if(!scenes.some(s=>s[0]===scene))throw Error('Unknown scene');state.scene=scene;state.query='';$('search').value='';defaults();render();}};
defaults();render();
})();
</script>
